                        <input type="email" id="email" name="email" data-i18n-placeholder="email-address" placeholder="you@example.com" required>

    <script>
        // Fetch CSRF token for the static register form
        fetch('get_csrf.php', {credentials: 'same-origin'})
            .then(r => r.json())
            .then(j => {
                const el = document.getElementById('csrf_token');
                if (el && j.csrf) el.value = j.csrf;
            }).catch(()=>{/* ignore */});
    </script>

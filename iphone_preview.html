<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Preview - MyWallet</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-container {
            position: relative;
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 209px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 32px;
        }
        .controls {
            margin-top: 30px;
            text-align: center;
        }
        .controls button {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 12px 24px;
            margin: 0 8px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .controls button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .controls button.active {
            background: rgba(255,255,255,0.4);
            border-color: rgba(255,255,255,0.6);
        }
        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .device-info {
            position: absolute;
            bottom: -35px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div>
        <h2>📱 iPhone Preview</h2>
        <div class="phone-container">
            <div class="phone-notch"></div>
            <div class="phone-screen">
                <iframe id="preview-frame" src="http://localhost:8000/index.html"></iframe>
            </div>
            <div class="device-info">iPhone 13 Pro - 375×812</div>
        </div>
        <div class="controls">
            <button onclick="loadPage('index.html')" class="active">Home</button>
            <button onclick="loadPage('login.html')">Login</button>
            <button onclick="loadPage('register.html')">Register</button>
            <button onclick="loadPage('dashboard.php')">Dashboard</button>
            <button onclick="loadPage('loans.php')">💳 Loans</button>
        </div>
    </div>

    <script>
        function loadPage(page) {
            document.getElementById('preview-frame').src = 'http://localhost:8000/' + page;
            
            // Update active button
            document.querySelectorAll('.controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
